<div class="container">
  <h2>Marvel Comics List</h2>
    <div class="user" *ngFor="let MarvelComics of MarvelComics;">
      <p>Id:{{MarvelComics.id}}</p>
      <p>{{MarvelComics.CharacterName}}<p>
      <p>{{MarvelComics.weapons}}</p>
      <p>{{MarvelComics.age}}</p>
      <p>{{MarvelComics.iscanfly?'Yes':'No'}}</p>
      <p>{{MarvelComics.power}}</p>
      <button type="button" (click)="delete(MarvelComics.id)">Delete</button>
      <button type="button" (click)="edit()">Edit</button>
      </div>
  <div *ngIf="error" class="error">{{error}}</div>
</div>
