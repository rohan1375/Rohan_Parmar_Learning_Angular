<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mat-form">


  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>CharacterName</mat-label>
    <input matInput type="text" formControlName="CharacterName" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>power</mat-label>
    <input matInput type="text" formControlName="power" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>weapons</mat-label>
    <input matInput type="text" formControlName="weapons" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>

  <div class="form-group">
    <label for="age">age</label>
    <input type="number" id="age" formControlName="age" [appHighlightOnFocus]="'silver'"/>
  </div>
  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>age</mat-label>
    <input matInput type="text" formControlName="age" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field" >
    <mat-label>iscanfly</mat-label>
    <input matInput type="text" formControlName="iscanfly" [appHighlightOnFocus]="'silver'" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" >Submit</button>
</form>
