<form [formGroup]="userForm"(ngSubmit)="onSubmit()">

  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="CharacterName">CharacterName</label>
    <input type="text" id="CharacterName" formControlName="CharacterName" />
  </div>

  <div class="form-group">
    <label for="power">power</label>
    <input type="text" id="power" formControlName="power" />
  </div>

  <div class="form-group">
    <label for="weapons">weapons</label>
    <input type="text" id="weapons" formControlName="weapons" />
  </div>

  <div class="form-group">
    <label for="age">age</label>
    <input type="number" id="age" formControlName="age" />
  </div>

  <div class="form-group">
    <label for="iscanfly">iscanfly</label>
    <input type="checkbox" id="iscanfly" formControlName="iscanfly" />
  </div>

  <button type="submit">Submit</button>
</form>
